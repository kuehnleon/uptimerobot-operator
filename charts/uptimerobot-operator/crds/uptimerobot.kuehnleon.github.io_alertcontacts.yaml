              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlertContactSpec defines a personal email or mobile push
              alert contact.
            properties:
              deviceName:
