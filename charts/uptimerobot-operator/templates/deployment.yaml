apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptimerobot-operator.fullname" . }}
  labels:
    {{- include "uptimerobot-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "uptimerobot-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uptimerobot-operator.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.apiKey.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "uptimerobot-operator.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --sync-interval={{ .Values.syncInterval }}
            - --api-rate-limit={{ .Values.apiRateLimit }}
            - --ingress={{ .Values.ingress }}
            - --traefik={{ .Values.traefik }}
            - --gateway-api={{ .Values.gatewayAPI }}
            - --leader-elect={{ .Values.leaderElection }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: UPTIMEROBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "uptimerobot-operator.secretName" . }}
                  key: {{ .Values.apiKey.secretKey }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
