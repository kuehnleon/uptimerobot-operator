{{- if not .Values.apiKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uptimerobot-operator.fullname" . }}
  labels:
    {{- include "uptimerobot-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiKey.secretKey }}: {{ required "apiKey.value or apiKey.existingSecret is required" .Values.apiKey.value | quote }}
{{- end }}
