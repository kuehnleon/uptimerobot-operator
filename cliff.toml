# git-cliff configuration, see https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

"""
body = """
{% if version -%}
## [{{ version }}](https://github.com/kuehnleon/uptimerobot-operator/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/kuehnleon/uptimerobot-operator/pull/${1}))" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|chore)\\(deps\\)", group = "<!-- 5 -->Dependencies" },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]

[bump]
# Before 1.0.0, breaking changes bump the minor instead of the major version.
breaking_always_bump_major = false
initial_tag = "v0.1.0"
