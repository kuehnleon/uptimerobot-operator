name: Release

# Updates CHANGELOG.md and the chart version, commits and tags the next version.
# Pushes use the Forgekeeper GitHub App token to trigger the Build workflow for the tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump, auto derives it from conventional commits
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          args: --bump ${{ inputs.bump != 'auto' && inputs.bump || '' }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit and tag
        env:
          TAG: ${{ steps.changelog.outputs.version }}
        run: |
          sed -i -e "s/^version:.*/version: ${TAG#v}/" -e "s/^appVersion:.*/appVersion: ${TAG#v}/" charts/uptimerobot-operator/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"
