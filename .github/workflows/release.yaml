name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build only, to verify the image (e.g. Dependabot base image updates).
  pull_request:
  # Updates CHANGELOG.md, tags the next version and releases it in the same run
  # (tags pushed with GITHUB_TOKEN trigger no workflows).
  workflow_dispatch:
    inputs:
      bump:
        description: Version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  packages: write

env:
  # Add linux/amd64 for a multi-platform image.
  PLATFORMS: linux/arm64

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Determine next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Update changelog and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" -q .body | sed -e "/^## What's Changed/d" -e 's/^### /#### /' -e 's/^## /### /')
          {
            head -n 2 CHANGELOG.md
            printf '## [v%s](https://github.com/%s/releases/tag/v%s) - %s\n\n%s\n\n' \
              "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" "$(date -u +%F)" "$notes"
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

  image:
    needs: tag
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version) || '' }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.event_name != 'workflow_dispatch' }}
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [tag, image]
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.version) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAGGED_VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version) || '' }}
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          version=${TAGGED_VERSION:-${GITHUB_REF_NAME#v}}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          helm package charts/uptimerobot-operator --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "uptimerobot-operator-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Create GitHub release
        run: gh release create "v$VERSION" "uptimerobot-operator-$VERSION.tgz" --generate-notes --verify-tag
