name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build only, to verify the image (e.g. Dependabot base image updates).
  pull_request:

# Cancel superseded PR runs; releases never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  # Add linux/amd64 for a multi-platform image.
  PLATFORMS: linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package charts/uptimerobot-operator --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "uptimerobot-operator-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create GitHub release
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            # The release title already shows the version.
            sed -e '1{/^## /d;}' RELEASE_NOTES.md | sed '/./,$!d'
            # shellcheck disable=SC2016 # literal Markdown code fence
            printf '\n## Artifacts\n\n```sh\ndocker pull ghcr.io/%s:%s\nhelm pull oci://ghcr.io/%s/charts/uptimerobot-operator --version %s\n```\n' \
              "$GITHUB_REPOSITORY" "$version" "$GITHUB_REPOSITORY_OWNER" "$version"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "uptimerobot-operator-$version.tgz" --notes-file notes.md --verify-tag
